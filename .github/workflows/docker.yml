name: Docker build

on:
  push:
    branches: [new, master]
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: seeing-the-unseen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
