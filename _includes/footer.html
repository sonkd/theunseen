{%- if site.google_analytics -%}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());

    gtag("config", "{{ site.google_analytics }}");
</script>
{%- endif -%}
{%- if page.url == '/archive/' or page.url contains '/categories/' or page.url contains '/404.html' -%}
<script src="/assets/js/search.min.js"></script>
<script>
    {% if page.url contains '/categories/' %}
    var searchInputId = 'search-stuff-input';
    {% else %}
    var searchInputId = 'search-input';
    {% endif %}
    var searchJson = '{{ site.baseurl }}/assets/search.json';
    var sjs = SimpleJekyllSearch({
      searchInput: document.getElementById(searchInputId),
      resultsContainer: document.getElementById('search-results'),
      json: searchJson,
    });
</script>
{%- endif -%}
