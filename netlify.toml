# Netlify build config — file này GHI ĐÈ mọi thiết lập trong Netlify UI.
# Astro build ra dist/ (không phải _site/ như thời Jekyll).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"   # gray-matter nằm ở devDependencies, cần cho scripts/ lúc prebuild

# Deploy preview / branch deploy dùng chung cấu hình
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
